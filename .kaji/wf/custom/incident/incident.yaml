name: incident
description: |
  series 自動選択対象外（member 単位 `--workflow` override でのみ使用）。run は Kaji recovery が所有する。
  第2層のインシデント原因調査・対応策提案。investigate/fix は complex tier、review/verify/report は routine tier の Claude を使う。
  第1層（failure triage）が起票した identity marker 付きインシデントイシューを入力とする。
  調査 → 査読 → 修正 → 確認 → 最終提案を回し、暫定原因分析・対応策・分類・統合提案を出力する。
  全終端は「提案」であり、ラベル遷移・クローズ・バグイシュー化・統合の実行は人間が行う。
execution_policy: auto
requires_provider: github        # 第1層と同じく GitHub provider のみ
default_timeout: 3600            # 再現実験を含むため標準より長め

# モデルは tier で割り当てる。tier の意味と選び方は docs/dev/workflow-overview.md の
# 「モデルの tier」を参照する。モデルを差し替えるときは、この x-models の値だけを変える。
x-models:
  claude-complex: &claude-complex opus
  claude-routine: &claude-routine sonnet

cycles:
  incident-review:
    entry: review
    loop: [fix, verify]
    max_iterations: 3
    on_exhaust: ABORT

steps:
  - id: investigate              # 提案役（調査）
    skill: incident-investigate
    agent: claude
    model: *claude-complex       # 調査は最難度の認知タスク
    effort: high
    on:
      PASS: review
      ABORT: end

  - id: review                   # workflowで設定したreviewerが独立rubricを適用
    skill: incident-review
    agent: claude
    model: *claude-routine       # 提案役（complex tier）と別モデルで査読
    effort: high
    on:
      PASS: report
      RETRY: fix
      ABORT: end

  - id: fix                      # 指摘対応（調査セッションを継続）
    skill: incident-fix
    agent: claude
    model: *claude-complex
    effort: medium
    resume: investigate
    on:
      PASS: verify
      ABORT: end

  - id: verify                   # 確認（新規指摘なし）
    skill: incident-verify
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: report
      RETRY: fix
      ABORT: end

  - id: report                   # 最終提案コメントの投稿
    skill: incident-report
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: end
      ABORT: end
