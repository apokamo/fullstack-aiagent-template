name: dev-thorough
description: |
  開発作業の丁寧版 workflow。標準devと同じskill・遷移・cycleを共有する。
  Claude Opusはdesign/fix-design=xhigh、implement/fix-code=high、その他=medium。
  Codexのレビュー・検証・最終確認はgpt-6.1-sol / highで実行する。
  implement/fix-code/pr-fixのtimeoutは21600秒とする。
  起動者が明示選択する追加構成。seriesの標準自動選択対象にはしない。
execution_policy: auto
requires_provider: github

# モデルは tier で割り当てる。tier の意味と選び方は docs/dev/workflow-overview.md の
# 「モデルの tier」を参照する。モデルを差し替えるときは、この x-models の値だけを変える。
x-models:
  codex-standard: &codex-standard gpt-6.1-sol
  claude-complex: &claude-complex opus
  claude-routine: &claude-routine sonnet

cycles:
  ready-review:
    entry: review-ready
    loop: [fix-ready, review-ready]
    max_iterations: 3
    on_exhaust: ABORT
  design-review:
    entry: review-design
    loop: [fix-design, verify-design]
    max_iterations: 3
    on_exhaust: ABORT
  code-review:
    entry: review-code
    loop: [fix-code, verify-code]
    max_iterations: 3
    on_exhaust: ABORT
  pr-review:
    entry: review-poll
    loop: [pr-fix, pr-verify]
    max_iterations: 3
    on_exhaust: ABORT

steps:
  - id: review-ready
    skill: issue-readiness-review
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: start
      RETRY: fix-ready
      ABORT: end

  - id: fix-ready
    skill: issue-readiness-fix
    agent: claude
    model: *claude-complex
    effort: medium
    on:
      PASS: review-ready
      ABORT: end

  - id: start
    skill: issue-worktree-create
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: design
      ABORT: end

  - id: design
    skill: issue-design-create
    agent: claude
    model: *claude-complex
    effort: xhigh
    on:
      PASS: review-design
      ABORT: end

  - id: review-design
    skill: issue-design-review
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: implement-precheck
      RETRY: fix-design
      ABORT: end

  - id: fix-design
    skill: issue-design-fix
    agent: claude
    model: *claude-complex
    effort: xhigh
    resume: design
    on:
      PASS: verify-design
      ABORT: end

  - id: verify-design
    skill: issue-design-verify
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: implement-precheck
      RETRY: fix-design
      ABORT: end

  - id: implement-precheck
    skill: issue-implementation-precheck
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: implement
      BACK_DESIGN: design
      ABORT: end

  - id: implement
    skill: issue-implementation-execute
    agent: claude
    model: *claude-complex
    effort: high
    timeout: 21600
    on:
      PASS: review-code
      RETRY: implement
      BACK: design
      ABORT: end

  - id: review-code
    skill: issue-implementation-review
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: final-check
      RETRY: fix-code
      BACK_DESIGN_FIX: fix-design
      BACK: design
      ABORT: end

  - id: fix-code
    skill: issue-implementation-fix
    agent: claude
    model: *claude-complex
    effort: high
    timeout: 21600
    on:
      PASS: verify-code
      ABORT: end

  - id: verify-code
    skill: issue-implementation-verify
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: final-check
      RETRY: fix-code
      ABORT: end

  - id: final-check
    skill: issue-final-check
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: pr
      RETRY: final-check
      BACK_DESIGN: design
      BACK_IMPLEMENT: implement
      ABORT: end

  - id: pr
    skill: pull-request-create
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: review-poll
      RETRY: pr
      ABORT: end

  - id: review-poll
    exec: [uv, run, --no-sync, python, -m, kaji_harness.scripts.review_poll_entry]
    on:
      PASS: close
      RETRY: pr-fix
      BACK_FALLBACK: review
      ABORT: end

  - id: review
    skill: pull-request-review
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: close
      RETRY: pr-fix
      ABORT: end

  - id: pr-fix
    skill: pull-request-fix
    agent: claude
    model: *claude-complex
    effort: medium
    timeout: 21600
    on:
      PASS: pr-verify
      ABORT: end

  - id: pr-verify
    skill: pull-request-verify
    agent: codex
    model: *codex-standard
    effort: high
    on:
      PASS: close
      RETRY: pr-fix
      ABORT: end

  - id: close
    skill: issue-close
    agent: claude
    model: *claude-routine
    effort: medium
    on:
      PASS: end
      ABORT: end
