# Alembic の設定。
#
# **接続先はここに書かない。** `sqlalchemy.url` を空のままにしてあるのは、
# `migrations/env.py` が **呼び出し側の選んだ context の必須 `DATABASE_URL`**
# だけから決めるため。
#
#   DB_ENV_CONTEXT=api   -> secrets/api.host.env の DATABASE_URL（app_dev）
#   DB_ENV_CONTEXT=test  -> secrets/test.env の DATABASE_URL（app_test）
#
# `DB_ENV_CONTEXT` に既定値は無く、未設定・未知の値は RuntimeError で落ちる ——
# 「env が残っていると意図と違う DB に流れる」を、既定値を持たないことと
# supported Make target 側での明示宣言（Makefile の各 target）で塞ぐ。
# `-x db_url=` は撤去した —— credential-bearing な DSN を alembic の argv に
# 載せる経路だったため。
#
# **branch を作らない。** `version_locations` を分けず、head は常に単数。
# `Makefile` の各 target も `upgrade head` 単数を使う。

[alembic]
script_location = migrations
prepend_sys_path = .
timezone = UTC

# revision ファイル名に日付を入れる（`versions/` を時系列で読めるようにする）。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
